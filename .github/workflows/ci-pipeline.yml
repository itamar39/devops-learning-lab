name: DevOps CI Pipeline

on:  
  push:    
    branches: [ main, master ]

jobs:  
  validate-code:    
    runs-on: ubuntu-latest    
    steps:    
    # 1. משיכת הקוד מה-Repository
    - name: Checkout repository code      
      uses: actions/checkout@v3    

    # 2. בדיקת זמינות Docker במכונת ה-CI
    - name: Check Docker installation      
      run: docker --version    

    # 3. בדיקת תקינות קובץ ה-Dockerfile (הצעד המקורי שלך)
    - name: Validate Dockerfile syntax      
      run: |        
        if [ -f my-custome-image/Dockerfile ]; then          
          echo "Dockerfile exists and is ready for build!"        
        else          
          echo "Dockerfile missing!"          
          exit 1        
        fi    

    # 3.1 [תוספת]: בדיקת עומק ל-Dockerfile עם Hadolint
    - name: Deep Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: "my-custome-image/Dockerfile"
        failure-threshold: warning

    # 4. בדיקת תקינות מבנית לקובץ ה-Kubernetes YAML (הצעד המקורי שלך)
    - name: Validate Kubernetes Manifests Syntax      
      run: |        
        python3 -c "import yaml; yaml.safe_load(open('k8s-lab1/deployment.yaml'))"        
        echo "Kubernetes YAML syntax is valid!"

# התקנה רשמית ומהירה של Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.8.0"

    # בדיקת קבצים בתיקיה הראשית
    - name: Validate Root Terraform
      run: |
        terraform init -backend=false
        terraform validate
        echo "Root Terraform syntax is valid!"

    # בדיקת קבצים בתיקיית terraform-lab1
    - name: Validate Lab1 Terraform
      run: |
        if [ -d terraform-lab1 ]; then
          cd terraform-lab1
          terraform init -backend=false
          terraform validate
          echo "Lab1 Terraform syntax is valid!"
        fi