name: Enterprise DevOps CI Pipeline

on:  
  push:    
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:  
  validate-all-infrastructure:    
    runs-on: ubuntu-latest    
    steps:    
    # 1. משיכת הקוד
    - name: Checkout repository code      
      uses: actions/checkout@v4

    # 2. בדיקת Dockerfile
    - name: Validate Dockerfile Syntax
      run: |        
        if [ -f my-custome-image/Dockerfile ]; then          
          echo "Dockerfile exists and is ready!"        
        else          
          echo "Dockerfile missing!"          
          exit 1        
        fi

    # 3. התקנה ובדיקת Terraform (ב-Root וב-terraform-lab1)
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.8.0"

    - name: Validate Terraform Code
      run: |
        echo "Validating Root Terraform..."
        terraform init -backend=false
        terraform validate

        if [ -d terraform-lab1 ]; then
          echo "Validating terraform-lab1..."
          cd terraform-lab1
          terraform init -backend=false
          terraform validate
          cd ..
        fi

    # 4. בדיקת Ansible Playbooks (ב-ansible-lab1)
    - name: Validate Ansible Playbooks
      run: |
        sudo apt-get update && sudo apt-get install -y ansible
        echo "Checking Ansible Syntax..."
        ansible-playbook -i "localhost," --syntax-check ansible-lab1/playbook.yml
        ansible-playbook -i "localhost," --syntax-check ansible-lab1/setup_nginx.yml

    # 5. בדיקת כל ה-Manifests של Kubernetes (ב-k8s-lab1)
    - name: Validate Kubernetes Manifests
      run: |
        python3 -c "
        import yaml, glob
        for f in glob.glob('k8s-lab1/*.yaml'):
            yaml.safe_load(open(f))
            print(f'Valid YAML: {f}')
        "